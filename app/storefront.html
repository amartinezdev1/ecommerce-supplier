<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RPM · Rebajas por Minuto</title><meta name="description" content="Consulta artículos por sucursal, conoce tu inversión y prepara tu cotización con RPM."><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/storefront.css"><link rel="stylesheet" href="/business.css"><script defer src="/icons.js"></script><script defer src="/excel-import.js"></script><script defer src="/storefront.js"></script></head><body style="margin:0;background:white"><div id="rpm-storefront-canvas">
<div id="rpm-reference-home" lang="es" aria-label="Tienda RPM Rebajas por Minuto">
  <div class="r5-utility">
    <div class="r5-container r5-utility-inner">
      <span><i data-lucide="truck" aria-hidden="true"></i> Al por mayor y al detal</span>
      <span><i data-lucide="badge-check" aria-hidden="true"></i> Cotiza y retira en tienda</span>
      <span><i data-lucide="messages-square" aria-hidden="true"></i> Atención por WhatsApp</span>
    </div>
  </div>
  <header class="r5-header r5-container">
    <button class="r5-logo" data-action="home" aria-label="RPM Rebajas por Minuto, inicio"><span class="r5-logo-mark"><b>RPM</b><small>DISTRIBUIDORA</small></span><span class="r5-logo-name">REBAJAS<br>POR<br>MINUTO</span></button>
    <nav class="r5-primary-nav" aria-label="Navegación de la tienda">
      <button class="r5-nav-home" data-action="home" aria-current="page">Inicio</button>
      <details name="r5-header-menu"><summary>Tienda <i data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="r5-nav-dropdown"><button data-filter="all">Ver todos los productos</button><button data-filter="offers">Ofertas</button><button data-action="quote">Mi cotización</button></div></details>
      <details name="r5-header-menu"><summary>Colecciones <i data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="r5-nav-dropdown"><button data-filter="recommended">Recomendados para ti</button><button data-filter="new">Recién llegados</button><button data-filter="best">Favoritos de nuestros clientes</button></div></details>
      <button data-filter="best">Más vendidos</button>
      <button data-filter="new">Novedades</button>
      <details name="r5-header-menu"><summary>Ayuda <i data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="r5-nav-dropdown"><button data-action="help">Cómo comprar</button><button data-action="about">Sobre RPM</button><button id="r5-branch-trigger" aria-expanded="false" aria-controls="r5-branch-panel">Av. Obaldía</button></div></details>
    </nav>
    <div class="r5-header-actions">
      <button data-action="toggle-search" aria-label="Buscar productos" aria-expanded="false" aria-controls="r5-search-panel"><i data-lucide="search" aria-hidden="true"></i></button>
      <button data-action="account" aria-label="Mi cuenta"><i data-lucide="user-round" aria-hidden="true"></i></button>
      <button data-action="quote" aria-label="Mi cotización"><span class="r5-cart-icon"><i data-lucide="shopping-cart" aria-hidden="true"></i><b id="r5-cart-count">2</b></span></button>
    </div>
  </header>
  <section class="r5-search-panel r5-container" id="r5-search-panel" aria-label="Búsqueda de productos" hidden>
    <div class="r5-search" role="search"><i data-lucide="search" aria-hidden="true"></i><input id="r5-search-input" type="search" aria-label="Buscar productos" placeholder="Busca un producto o una marca"><button data-action="search">Buscar</button></div>
    <button class="r5-search-close" data-action="toggle-search" aria-label="Cerrar búsqueda"><i data-lucide="x" aria-hidden="true"></i></button>
  </section>

  <section id="r5-branch-panel" class="r5-branch-panel" aria-label="Elegir sucursal" hidden><h2>Elige tu sucursal</h2><p>Consulta sus productos y precios.</p><button data-branch="0">Av. Obaldía <small>David</small></button><button data-branch="1">Calle 4ta <small>David</small></button><button data-branch="2">Puerto Armuelles <small>Chiriquí</small></button></section>
  <main id="r5-main"></main>
  <footer id="r5-footer" class="r5-footer"></footer>
  <div id="r5-dialog-host"></div>
  <div id="r5-toast" class="r5-toast" role="status" aria-live="polite" hidden></div>
</div>
</div>
</body></html>
