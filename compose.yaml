name: rpm-vercel
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rpm
      POSTGRES_PASSWORD: ${RPM_LOCAL_DB_PASSWORD:-rpm-local-only}
      POSTGRES_DB: rpm
    ports:
      - '127.0.0.1:${RPM_LOCAL_DB_PORT:-55471}:5432'
    volumes:
      - rpm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rpm -d rpm']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  rpm_postgres:
